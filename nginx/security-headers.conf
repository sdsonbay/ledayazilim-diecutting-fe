# Her location'da yeniden eklenir: nginx'te bir location kendi add_header'ını tanımlarsa
# sunucu düzeyindekiler o location için geçersiz olur.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Oturum anahtarı tarayıcıda tutulduğu için betikler yalnız kendi kökenimizden yüklenir (XSS'e karşı).
# Stiller satır içi (react-native-web), görseller ve dokular data:/blob: olabilir.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; media-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
